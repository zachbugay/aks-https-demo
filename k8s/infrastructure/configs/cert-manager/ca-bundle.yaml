# https://cert-manager.io/docs/trust/trust-manager/
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: demo-ca-bundle
spec:
  sources:
    - secret:
        name: demo-ca
        key: ca.crt
  target:
    configMap:
      # ca.crt is the key BackendTLSPolicy's caCertificateRefs requires.
      key: ca.crt
    namespaceSelector:
      matchLabels:
        # httpbin and podinfo actually run in the "apps" namespace.
        kubernetes.io/metadata.name: apps
