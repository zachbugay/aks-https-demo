# https://gateway-api.sigs.k8s.io/guides/tls/#upstream-tls
# Tells the Gateway to connect to the httpbin Service over TLS, validating
# the backend's certificate against the cluster's demo CA.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: httpbin-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: httpbin
  validation:
    caCertificateRefs:
      - kind: ConfigMap
        group: ""
        name: demo-ca-bundle
    hostname: httpbin.apps.svc.cluster.local
